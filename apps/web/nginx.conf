# Serves the built web app and forwards /api to the API container, including WebSocket upgrades for
# board sync. TLS is terminated in front of this container; see README.md, "Deployment".

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Sign-in, registration and sign-out attempts per client address. The API has its own limits as well.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Import files are up to 8 MB (MAX_IMPORT_BYTES in the API); the rest of the request is small.
  client_max_body_size 9m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # If a TLS proxy sits in front of this container, nginx would see that proxy's address for every
  # client, and the per-address limits would apply to everyone. Then uncomment these lines, set the
  # proxy's address, and rebuild the image.
  # set_real_ip_from 10.0.0.1;
  # real_ip_header X-Forwarded-For;
  # real_ip_recursive on;

  # Headers for every proxied request. The API trusts X-Forwarded-For only from this container's
  # network (TRUST_PROXY), and nginx appends to any value a client sent, so it cannot be spoofed.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/auth/ {
    limit_except GET {
      limit_req zone=auth burst=10 nodelay;
    }
    limit_req_status 429;
    proxy_pass http://api:21080;
  }

  location /api/ {
    proxy_pass http://api:21080;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Built asset names contain a content hash, so they can be cached for a long time. These locations
  # use expires rather than add_header, because an add_header here would drop the security headers
  # set above.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # The service worker and the app shell must always be revalidated, so a new release is picked up.
  location = /sw.js {
    expires -1;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
