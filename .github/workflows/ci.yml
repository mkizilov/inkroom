name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inkroom
          POSTGRES_PASSWORD: inkroom
          POSTGRES_DB: inkroom
        ports:
          - 21432:5432
        options: >-
          --health-cmd "pg_isready -U inkroom -d inkroom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://inkroom:inkroom@127.0.0.1:21432/inkroom
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inkroom
          POSTGRES_PASSWORD: inkroom
          POSTGRES_DB: inkroom
        ports:
          - 21432:5432
        options: >-
          --health-cmd "pg_isready -U inkroom -d inkroom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://inkroom:inkroom@127.0.0.1:21432/inkroom
      TEST_DATABASE_URL: postgres://inkroom:inkroom@127.0.0.1:21432/inkroom
      WEB_ORIGIN: http://127.0.0.1:21173
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @inkroom/web exec playwright install --with-deps chromium

      - run: pnpm db:migrate

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results/
          if-no-files-found: ignore
